# Production: docker compose up -d --build   (see docs/DEPLOY.md)
# caddy (HTTPS, ports 80/443) -> web (Next.js) ; worker (jobs, renders). Web and worker share ./data
# (SQLite, media, shared AI keys), so the three run on one machine.
services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. studio.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

  web:
    build: .
    restart: unless-stopped
    # Not published to the internet: only Caddy reaches it. 127.0.0.1 lets you check it from the server itself.
    ports:
      - "127.0.0.1:3300:3300"
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: ["npx", "tsx", "src/worker/index.ts"]
    volumes:
      - ./data:/data
    env_file:
      - path: .env
        required: false
    # Remotion renders with Chrome, which needs more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
