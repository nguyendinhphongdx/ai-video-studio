<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Video Studio</title>
<style>
  @font-face { font-family: "Baloo2"; src: url("/fonts/Baloo2.ttf"); font-weight: 400 800; font-display: swap; }
  @font-face { font-family: "PatrickHand"; src: url("/fonts/PatrickHand-Regular.ttf"); font-display: swap; }
  :root {
    --bg: #F6F5F2; --surface: #FFFFFF; --sunken: #F0EEEA; --ink: #17151F; --ink-2: #4A4757; --muted: #8A8696;
    --line: #E7E4DE; --line-2: #D9D5CD;
    --primary: #5B3DF5; --primary-ink: #fff; --primary-soft: #EEEAFF; --primary-2: #4428D9;
    --sun: #FFC53D; --ok: #0F9D63; --ok-soft: #E3F6EC; --warn: #B7791F; --warn-soft: #FFF4DB; --bad: #D9314A; --bad-soft: #FDE8EB;
    --radius: 18px; --radius-sm: 12px;
    --shadow: 0 1px 2px rgba(23,21,31,.06), 0 4px 16px rgba(23,21,31,.06);
    --shadow-lg: 0 10px 40px rgba(23,21,31,.16);
    --display: "Baloo2", ui-rounded, system-ui, sans-serif;
    --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--body); background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; line-height: 1.15; margin: 0; letter-spacing: -.01em; }
  a { color: var(--primary); }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  input, textarea, select { font: inherit; color: inherit; }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }

  /* ---------- top bar ---------- */
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(246,245,242,.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .topbar-in { max-width: 1280px; margin: 0 auto; padding: 10px 24px; display: flex; align-items: center; gap: 14px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .logo-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; background: conic-gradient(from 200deg, #5B3DF5, #FF5C8A, #FFC53D, #5B3DF5); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35); }
  .logo b { font-family: var(--display); font-size: 19px; }
  .topbar .spacer { flex: 1; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--ink-2); white-space: nowrap; }
  button.pill:hover { border-color: var(--line-2); background: #fff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--warn); }

  /* ---------- buttons ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; background: var(--surface); border: 1px solid var(--line-2); color: var(--ink); transition: background .15s, border-color .15s, transform .05s; white-space: nowrap; }
  .btn:hover { background: var(--sunken); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); box-shadow: 0 4px 14px rgba(91,61,245,.28); }
  .btn.primary:hover { background: var(--primary-2); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--sunken); }
  .btn.danger { color: var(--bad); }
  .btn.lg { padding: 14px 22px; font-size: 16px; border-radius: 14px; }
  .btn.sm { padding: 6px 10px; font-size: 13px; border-radius: 10px; }
  .icon-btn { width: 34px; height: 34px; border-radius: 10px; display: inline-grid; place-items: center; color: var(--ink-2); }
  .icon-btn:hover { background: var(--sunken); color: var(--ink); }

  /* ---------- layout ---------- */
  .page { max-width: 1280px; margin: 0 auto; padding: 28px 24px 120px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
  .section-head { display: flex; align-items: center; gap: 12px; margin: 40px 0 16px; flex-wrap: wrap; }
  .section-head h2 { font-size: 24px; }

  /* ---------- home: composer ---------- */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: stretch; }
  @media (max-width: 980px) { .hero { grid-template-columns: 1fr; } }
  .composer { padding: 28px; }
  .composer h1 { font-size: 34px; }
  .composer h1 em { font-style: normal; background: linear-gradient(90deg, #5B3DF5, #FF5C8A); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .composer .sub { color: var(--ink-2); margin: 6px 0 18px; }
  .idea-box { border: 1.5px solid var(--line-2); border-radius: 16px; background: #fff; padding: 14px 16px 10px; transition: border-color .15s, box-shadow .15s; }
  .idea-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
  .idea-box textarea { width: 100%; border: 0; outline: 0; resize: none; font-size: 18px; line-height: 1.45; min-height: 58px; background: transparent; }
  .idea-tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 8px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { padding: 7px 12px; border-radius: 999px; background: var(--sunken); border: 1px solid transparent; font-size: 13px; color: var(--ink-2); }
  .chip:hover { border-color: var(--line-2); background: #fff; color: var(--ink); }
  .chip.on { background: var(--primary-soft); color: var(--primary-2); border-color: #D6CEFF; }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin: 18px 0 8px; }
  .formats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .fmt { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 14px; border: 1.5px solid var(--line); background: #fff; text-align: left; }
  .fmt:hover { border-color: var(--line-2); }
  .fmt.on { border-color: var(--primary); background: var(--primary-soft); }
  .fmt .shape { border: 2px solid currentColor; border-radius: 4px; flex: none; color: var(--ink-2); }
  .fmt.on .shape { color: var(--primary); background: rgba(91,61,245,.12); }
  .fmt b { display: block; font-size: 14px; }
  .fmt small { color: var(--muted); font-size: 12px; }
  .fmt .check { margin-left: auto; width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 12px; color: transparent; flex: none; }
  .fmt.on .check { background: var(--primary); border-color: var(--primary); color: #fff; }
  details.adv { margin-top: 16px; border-top: 1px dashed var(--line-2); padding-top: 12px; }
  details.adv summary { cursor: pointer; color: var(--ink-2); font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 6px; }
  details.adv summary::-webkit-details-marker { display: none; }
  details.adv summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 18px; line-height: 1; }
  details.adv[open] summary::before { transform: rotate(90deg); }
  .adv-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 12px; }
  .field label { display: block; font-size: 13px; color: var(--ink-2); font-weight: 600; margin-bottom: 6px; }
  .input, .field select, .field input[type=text], .field input[type=number], .field input[type=password], .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: 10px; background: #fff; outline: 0; }
  .input:focus, .field select:focus, .field input:focus, .field textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .field textarea { resize: vertical; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .tpl-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tpl { border: 1.5px solid var(--line); border-radius: 12px; padding: 6px; text-align: left; background: #fff; }
  .tpl.on { border-color: var(--primary); background: var(--primary-soft); }
  .tpl .frame { border-radius: 8px; }
  .tpl span { display: block; font-size: 12px; font-weight: 600; margin: 6px 2px 2px; }
  .composer-foot { display: flex; align-items: center; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
  .composer-foot .note { font-size: 13px; color: var(--muted); }

  .channel-card { padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .channel-card .head { display: flex; align-items: center; gap: 12px; }
  .channel-card img { width: 52px; height: 52px; border-radius: 14px; object-fit: cover; box-shadow: var(--shadow); }
  .channel-card h3 { font-size: 20px; }
  .kv { font-size: 13px; color: var(--ink-2); }
  .kv b { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
  .how { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
  .how li { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: var(--ink-2); }
  .how li i { font-style: normal; width: 24px; height: 24px; border-radius: 8px; background: var(--sunken); display: grid; place-items: center; font-size: 13px; flex: none; }
  .how li.me i { background: var(--sun); }

  /* ---------- home: library ---------- */
  .tabs { display: inline-flex; gap: 4px; padding: 4px; background: var(--sunken); border-radius: 12px; }
  .tab { padding: 6px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .tab.on { background: #fff; color: var(--ink); box-shadow: var(--shadow); }
  .tab .n { margin-left: 4px; color: var(--muted); font-weight: 500; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .vcard { overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s; position: relative; display: flex; flex-direction: column; }
  .vcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .vcard .thumb { position: relative; }
  .vcard .thumb .frame { border-radius: 0; }
  .vcard .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .vcard .title { font-weight: 700; font-size: 15px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .vcard .meta { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .vcard .next { margin-top: auto; padding-top: 6px; font-size: 13px; font-weight: 700; color: var(--primary); }
  .vcard .del { position: absolute; top: 8px; right: 8px; background: rgba(255,255,255,.9); opacity: 0; transition: opacity .15s; }
  .vcard:hover .del { opacity: 1; }
  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--sunken); color: var(--ink-2); }
  .badge.need { background: var(--warn-soft); color: var(--warn); }
  .badge.busy { background: var(--primary-soft); color: var(--primary-2); }
  .badge.done { background: var(--ok-soft); color: var(--ok); }
  .badge.err { background: var(--bad-soft); color: var(--bad); }
  .thumb .badge { position: absolute; left: 8px; top: 8px; box-shadow: var(--shadow); }
  .empty { padding: 48px 24px; text-align: center; color: var(--ink-2); }
  .empty .big { font-size: 44px; }

  /* ---------- video-frame preview (mirrors the Remotion "cards" template) ---------- */
  .frame { --c: #4FC3F7; position: relative; aspect-ratio: 16 / 9; width: 100%; overflow: hidden; border-radius: 12px; container-type: inline-size;
    background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c) 82%, white), color-mix(in srgb, var(--c) 82%, black));
    font-family: var(--display); color: #fff; }
  /* Layout lives on an inner box: cqw units on the container's own padding/gap would resolve against the viewport. */
  .frame > .fi { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 4cqw; padding: 4cqw 6cqw; }
  .frame.portrait { aspect-ratio: 9 / 16; }
  .frame.portrait > .fi, .frame.intro > .fi, .frame.outro > .fi { flex-direction: column; }
  .frame.intro > .fi, .frame.outro > .fi { gap: 2cqw; }
  .frame .spark { position: absolute; font-size: 3cqw; opacity: .7; }
  .frame .hd { font-weight: 800; line-height: 1; text-align: center; -webkit-text-stroke: .9cqw #1E3A6B; paint-order: stroke fill; min-width: 25cqw; }
  .frame .side { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2.5cqw; min-width: 0; }
  .frame .emojis { display: flex; flex-wrap: wrap; justify-content: center; gap: 1cqw; line-height: 1.1; }
  .frame .cap { font-weight: 800; font-size: 5cqw; text-align: center; -webkit-text-stroke: .5cqw #1E3A6B; paint-order: stroke fill; line-height: 1.1; overflow-wrap: anywhere; }
  .frame.board { background: #FDFDFB; color: #2B2B2B; font-family: "PatrickHand", var(--display); }
  .frame.board .hd, .frame.board .cap { -webkit-text-stroke: 0; color: var(--c); }
  .frame.board .cap { color: #333; font-weight: 400; }
  .frame.board .emojis { border: .5cqw solid var(--c); border-radius: 50%; padding: 3cqw; }
  .frame .logo-img { width: 16cqw; height: 16cqw; border-radius: 3cqw; object-fit: cover; box-shadow: 0 1cqw 3cqw rgba(0,0,0,.2); }
  .frame .ttl { font-weight: 800; font-size: 8cqw; text-align: center; line-height: 1; -webkit-text-stroke: .8cqw #1E3A6B; paint-order: stroke fill; }
  .frame .sub-btn { background: #FF0033; color: #fff; font-weight: 800; font-size: 4.2cqw; padding: 1.4cqw 3.5cqw; border-radius: 99cqw; box-shadow: 0 1cqw 0 #A80022; }
  .frame .outro-t { font-weight: 800; font-size: 5.5cqw; -webkit-text-stroke: .5cqw #1E3A6B; paint-order: stroke fill; text-align: center; }
  .frame.board .ttl, .frame.board .outro-t { -webkit-text-stroke: 0; color: #2F6FE0; }
  .frame.ghost { background: linear-gradient(110deg, #ECE9E3 30%, #F6F4F0 50%, #ECE9E3 70%); background-size: 200% 100%; animation: shimmer 1.4s linear infinite; color: var(--muted); font-family: var(--body); text-align: center; }
  .frame.ghost span { font-size: 5cqw; font-weight: 600; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- workspace ---------- */
  .ws-head { display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .ws-head .back { margin-left: -10px; }
  .ws-title { flex: 1; min-width: 240px; }
  .ws-title h1 { font-size: 30px; }
  .ws-title .meta { margin-top: 6px; display: flex; gap: 10px; align-items: center; color: var(--ink-2); font-size: 14px; flex-wrap: wrap; }
  .ws-title .meta img { width: 22px; height: 22px; border-radius: 6px; }
  .stepper { display: flex; align-items: center; gap: 0; margin: 22px 0 22px; overflow-x: auto; padding-bottom: 2px; }
  .st { display: flex; align-items: center; gap: 10px; color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .st .n { width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line-2); display: grid; place-items: center; font-size: 13px; background: #fff; }
  .st.done { color: var(--ink-2); } .st.done .n { background: var(--ok); border-color: var(--ok); color: #fff; }
  .st.now { color: var(--ink); } .st.now .n { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 0 0 4px var(--primary-soft); }
  .st-line { flex: 1; min-width: 24px; height: 2px; background: var(--line-2); margin: 0 12px; }
  .st-line.done { background: var(--ok); }

  .banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 14px; margin-bottom: 18px; }
  .banner.err { background: var(--bad-soft); color: #8E1C2E; }
  .banner.info { background: var(--primary-soft); color: var(--primary-2); }
  .banner .msg { flex: 1; }
  .banner b { display: block; }

  .board-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .board-head h2 { font-size: 22px; }
  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .revise { display: flex; gap: 10px; align-items: center; padding: 10px 10px 10px 16px; margin-bottom: 18px; }
  .revise .ai { font-size: 20px; }
  .revise input { flex: 1; border: 0; outline: 0; font-size: 15px; min-width: 120px; background: transparent; }
  .revise-chips { margin: -8px 0 18px; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .shot { padding: 10px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow .15s, border-color .15s; }
  .shot.sel { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft), var(--shadow); }
  .shot .frame { cursor: pointer; }
  .shot .row { display: flex; align-items: center; gap: 6px; }
  .shot .tag { font-size: 12px; font-weight: 700; color: var(--ink-2); }
  .shot .dur { font-size: 12px; color: var(--muted); }
  .shot .narr { font-size: 14px; color: var(--ink-2); line-height: 1.45; display: flex; gap: 8px; align-items: flex-start; }
  .shot .narr p { margin: 0; flex: 1; }
  .play { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-soft); color: var(--primary-2); display: grid; place-items: center; flex: none; font-size: 12px; }
  .play:hover { background: #DFD8FF; }
  .play.loading { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .add-shot { border: 2px dashed var(--line-2); border-radius: var(--radius); display: grid; place-items: center; min-height: 180px; color: var(--ink-2); font-weight: 600; background: transparent; }
  .add-shot:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }

  /* side drawer for editing one shot */
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); background: var(--surface); box-shadow: var(--shadow-lg); z-index: 40; transform: translateX(105%); transition: transform .22s ease; display: flex; flex-direction: column; }
  .drawer.open { transform: none; }
  .drawer header { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .drawer header h3 { flex: 1; font-size: 18px; }
  .drawer .content { padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .drawer footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .sw { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line-2); }
  .sw.on { box-shadow: 0 0 0 2px var(--ink); }
  .stepper-num { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
  .stepper-num button { width: 36px; height: 38px; font-size: 18px; }
  .stepper-num button:hover { background: var(--sunken); }
  .stepper-num span { min-width: 36px; text-align: center; font-weight: 700; }
  .two { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }

  /* sticky action bar */
  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
  .actionbar-in { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .actionbar .spacer { flex: 1; }
  .dirty { font-size: 13px; color: var(--warn); font-weight: 600; }
  .seg { display: inline-flex; gap: 6px; flex-wrap: wrap; }
  .seg button { padding: 7px 12px; border-radius: 10px; border: 1.5px solid var(--line-2); font-size: 13px; font-weight: 600; color: var(--ink-2); background: #fff; }
  .seg button.on { border-color: var(--primary); color: var(--primary-2); background: var(--primary-soft); }

  /* production */
  .prod { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; }
  @media (max-width: 980px) { .prod { grid-template-columns: 1fr; } }
  .prod-main { padding: 28px; }
  .big-pct { font-family: var(--display); font-size: 64px; font-weight: 800; line-height: 1; }
  .bar { height: 12px; background: var(--sunken); border-radius: 99px; overflow: hidden; margin: 16px 0 22px; }
  .bar > div { height: 100%; background: linear-gradient(90deg, #5B3DF5, #FF5C8A); border-radius: 99px; transition: width .6s ease; }
  .phases { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .phases li { display: flex; gap: 12px; align-items: center; color: var(--muted); font-weight: 600; }
  .phases li .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--line-2); font-size: 13px; background: #fff; flex: none; }
  .phases li.done { color: var(--ink-2); } .phases li.done .ic { background: var(--ok); border-color: var(--ok); color: #fff; }
  .phases li.now { color: var(--ink); } .phases li.now .ic { border-color: var(--primary); color: var(--primary); }
  .spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: rot .8s linear infinite; display: inline-block; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .mini-shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; padding: 16px; }

  .players { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }

  .msg-err { background: var(--bad-soft); color: #8E1C2E; padding: 10px 12px; border-radius: 10px; font-size: 13px; }

  .toast.show { opacity: 1; transform: translateX(-50%); }

  @media (max-width: 640px) {

  }
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <a class="logo" href="#/"><span class="logo-mark">🎬</span><b>AI Video Studio</b></a>
  <span class="spacer"></span>
  <button class="pill" id="aiPill" title="Cài đặt AI"></button>
  <span class="pill hide-sm" id="voicePill"></span>
  <button class="icon-btn" id="openSettings" title="Cài đặt" aria-label="Cài đặt">⚙️</button>
</div></div>

<div id="app"></div>
<div class="toast" id="toast"></div>

<aside class="drawer" id="drawer" aria-hidden="true"></aside>

<dialog id="settings">
  <div class="dh"><h2>Cài đặt AI viết kịch bản</h2><button class="icon-btn" id="s-close" aria-label="Đóng">✕</button></div>
  <div class="db">
    <div class="field"><label>Nhà cung cấp</label><select id="s-provider"></select></div>
    <div class="field"><label>Model</label><input type="text" id="s-model" list="s-models" autocomplete="off" /><datalist id="s-models"></datalist></div>
    <div class="field" id="s-baseUrl-row"><label>Base URL</label><input type="text" id="s-baseUrl" placeholder="http://localhost:11434/v1" />
      <div class="hint">Ollama: http://localhost:11434/v1 · LM Studio: http://localhost:1234/v1 · OpenRouter: https://openrouter.ai/api/v1</div></div>
    <div class="field"><label>API key</label><input type="password" id="s-apiKey" autocomplete="off" /><div class="hint" id="s-keyHint"></div></div>
    <div class="field" id="s-effort-row"><label>Mức suy nghĩ</label><select id="s-effort"></select><div class="hint">Cao hơn: kịch bản kỹ hơn nhưng chậm và tốn hơn.</div></div>
    <div id="s-result"></div>
  </div>
  <div class="df">
    <button class="btn primary" id="s-save">Lưu</button><button class="btn" id="s-test">Kiểm tra kết nối</button>
    <span style="flex:1"></span><button class="btn ghost danger" id="s-clearKey">Xoá key</button>
  </div>
</dialog>

<script>
// ============================================================ helpers
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
async function api(url, body, method) {
  const opts = body === undefined && !method ? {} : { method: method || "POST", headers: { "content-type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) };
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
let toastTimer;
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}
const guard = (fn) => (...a) => Promise.resolve(fn(...a)).catch((e) => toast("⚠️ " + e.message));
function ago(iso) {
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "vừa xong";
  if (s < 3600) return `${Math.floor(s / 60)} phút trước`;
  if (s < 86400) return `${Math.floor(s / 3600)} giờ trước`;
  if (s < 86400 * 7) return `${Math.floor(s / 86400)} ngày trước`;
  return new Date(iso).toLocaleDateString("vi-VN");
}
// Rough spoken length: ~2.6 words/s at the default -8% rate, plus the 0.9s pad the renderer adds.
const estSec = (text, min = 3.5) => Math.max(min, (String(text || "").trim().split(/\s+/).filter(Boolean).length / 2.6) + 0.9);
const fmtDur = (s) => (s >= 60 ? `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, "0")}` : `${Math.round(s)}s`);

// ============================================================ state
let config = null;
let projects = [];
let current = null;      // project open in the workspace
let draft = null;        // editable copy of current.spec
let dirty = false;
let selected = null;     // shot key being edited in the drawer
let pollTimer = null;
let libFilter = "all";
const home = { idea: "", formats: ["landscape"], template: "cards", sceneCount: "", voice: "", music: true, engines: ["remotion"], brand: "" };

const STATUS = {
  draft: { label: "Đang viết kịch bản", cls: "busy", next: "Xem tiến độ" },
  script_review: { label: "Chờ duyệt kịch bản", cls: "need", next: "Duyệt kịch bản →" },
  producing: { label: "Đang sản xuất", cls: "busy", next: "Xem tiến độ" },
  video_review: { label: "Chờ duyệt video", cls: "need", next: "Xem & duyệt video →" },
  approved: { label: "Sẵn sàng đăng", cls: "done", next: "Lấy nội dung đăng bài →" },
};
const IDEAS = ["Bé học đếm từ 1 đến 10 với các con vật", "Bé học màu sắc qua trái cây", "Bé học chữ cái A B C", "Vòng đời của con bướm", "Các phương tiện giao thông", "Bé đánh răng đúng cách"];
const PALETTE = ["#FF6B6B", "#FF9F43", "#FECA57", "#1DD1A1", "#48DBFB", "#4FC3F7", "#5F27CD", "#A55EEA", "#FF78C4", "#10AC84"];
const ENGINE = { remotion: "Remotion", hyperframes: "HyperFrames" };
const brandOf = (id) => config.brands.find((b) => b.id === id) || config.brands[0] || { id, name: id, logo: "" };
const logoUrl = (b) => (b?.id ? `/brands/${b.id}/logo.png` : "");
const isBusy = (p) => Boolean(p.job && !p.job.error);
const needsYou = (p) => !isBusy(p) && (["draft", "script_review", "video_review"].includes(p.status) || Boolean(p.job?.error));

// ============================================================ frame preview
function sparks() {
  return [[8, 12], [82, 10], [90, 70], [14, 78], [50, 6]].map(([l, t]) => `<span class="spark" style="left:${l}%;top:${t}%">✨</span>`).join("");
}
// Same sizes as remotion/Video.tsx (px on a 1920-wide frame), as % of the frame width.
function headingSize(h) { const n = [...String(h)].length; return (n <= 2 ? 380 : n <= 4 ? 250 : n <= 7 ? 170 : 120) / 19.2; }
function emojiSize(count) { return (count <= 1 ? 300 : count <= 3 ? 210 : count <= 6 ? 160 : 120) / 19.2; }
function frameScene(sc, { template = "cards", portrait = false } = {}) {
  const board = template === "whiteboard";
  const n = Math.min(10, Math.max(1, sc.count || 1));
  return `<div class="frame ${board ? "board" : ""} ${portrait ? "portrait" : ""}" style="--c:${esc(sc.color)}">
    ${board ? "" : sparks()}
    <div class="fi"><div class="hd" style="font-size:${headingSize(sc.heading)}cqw">${esc(sc.heading)}</div>
    <div class="side"><div class="emojis" style="font-size:${emojiSize(n)}cqw">${esc(sc.emoji).repeat(n)}</div><div class="cap">${esc(sc.caption)}</div></div></div></div>`;
}
function frameIntro(spec, brand) {
  const board = spec.template === "whiteboard";
  return `<div class="frame intro ${board ? "board" : ""}" style="--c:#4FC3F7">${board ? "" : sparks()}
    <div class="fi"><img class="logo-img" src="${logoUrl(brand)}" alt="" onerror="this.style.display='none'"><div class="ttl">${esc(spec.title)}</div></div></div>`;
}
function frameOutro(spec, brand) {
  const board = spec.template === "whiteboard";
  return `<div class="frame outro ${board ? "board" : ""}" style="--c:#2F8BE6">${board ? "" : sparks()}
    <div class="fi"><img class="logo-img" src="${logoUrl(brand)}" alt="" onerror="this.style.display='none'">
    <div class="sub-btn">${esc(brand.subscribeText || "🔔 ĐĂNG KÝ KÊNH")}</div><div class="outro-t">${esc(brand.outroText || "Hẹn gặp lại!")}</div></div></div>`;
}
function thumbFor(p) {
  if (!p.spec) return `<div class="frame ghost"><div class="fi"><span>${isBusy(p) ? "✍️ AI đang viết…" : "📋 Chưa có kịch bản"}</span></div></div>`;
  const sc = p.spec.scenes[0];
  return sc ? frameScene(sc, { template: p.spec.template }) : frameIntro(p.spec, brandOf(p.brand));
}

// ============================================================ voice preview
const voiceCache = new Map();
let audio = null;
async function speak(btn, text, voice) {
  if (!config.tts) return toast("Giọng đọc đang tắt (chưa cài edge-tts)");
  if (!text?.trim()) return toast("Chưa có lời đọc");
  if (audio) { audio.pause(); $$(".play").forEach((b) => (b.textContent = "▶")); }
  const key = `${voice}|${text}`;
  btn.classList.add("loading");
  try {
    let url = voiceCache.get(key);
    if (!url) { url = (await api("/api/tts/preview", { text, voice })).url; voiceCache.set(key, url); }
    audio = new Audio(url);
    btn.textContent = "■";
    audio.onended = () => (btn.textContent = "▶");
    await audio.play();
  } finally { btn.classList.remove("loading"); }
}

// ============================================================ header + config
async function loadConfig() {
  config = await api("/api/config");
  const ai = $("#aiPill");
  ai.innerHTML = config.llmConfigured ? `<span class="dot"></span>${esc(config.llm.providerLabel)} · ${esc(config.llm.model)}` : `<span class="dot off"></span>Chưa cài AI`;
  $("#voicePill").innerHTML = config.tts ? `<span class="dot"></span>Giọng đọc sẵn sàng` : `<span class="dot off"></span>Giọng đọc tắt`;
  if (!home.brand) home.brand = config.brands[0]?.id || "";
  if (!home.voice) home.voice = brandOf(home.brand).voice || Object.keys(config.voices)[0];
}

// ============================================================ router
function route() {
  closeDrawer(true);
  clearTimeout(pollTimer);
  const h = location.hash.replace(/^#\/?/, "");
  const m = /^p\/([a-z0-9-]+)$/.exec(h) || /^([a-z0-9-]{12,})$/.exec(h);
  if (m) return openProject(m[1]);
  current = null;
  renderHome();
}
window.addEventListener("hashchange", guard(() => config && route()));

// ============================================================ home
async function renderHome() {
  projects = await api("/api/projects");
  const b = brandOf(home.brand);
  const counts = {
    all: projects.length,
    need: projects.filter(needsYou).length,
    busy: projects.filter((p) => isBusy(p)).length,
    done: projects.filter((p) => p.status === "approved").length,
  };
  const shown = projects.filter((p) => libFilter === "all" ? true : libFilter === "need" ? needsYou(p) : libFilter === "busy" ? isBusy(p) : p.status === "approved");
  const brandOpts = config.brands.map((x) => `<option value="${x.id}" ${x.id === home.brand ? "selected" : ""}>${esc(x.name)}</option>`).join("");
  const fmtIcon = (k) => (k === "portrait" ? `<span class="shape" style="width:16px;height:26px"></span>` : `<span class="shape" style="width:30px;height:18px"></span>`);
  const fmtSub = { landscape: "YouTube · Facebook", portrait: "TikTok · Reels · Shorts" };
  $("#app").innerHTML = `<div class="page">
    <div class="hero">
      <section class="card composer">
        <h1>Hôm nay làm video gì cho <em>${esc(b.name)}</em>?</h1>
        <p class="sub">Gõ một ý tưởng. AI viết kịch bản, bạn xem trước từng cảnh và nghe thử giọng đọc rồi mới bấm sản xuất.</p>
        <div class="idea-box">
          <textarea id="idea" rows="2" placeholder="VD: Bé học đếm từ 1 đến 10 với các con vật">${esc(home.idea)}</textarea>
          <div class="idea-tools"><span class="muted" style="font-size:13px">Gợi ý:</span><div class="chips">${IDEAS.slice(0, 4).map((i) => `<button class="chip" data-idea="${esc(i)}">${esc(i)}</button>`).join("")}</div></div>
        </div>
        <div class="label">Đăng lên đâu?</div>
        <div class="formats">${Object.entries(config.formats).map(([k, v]) => `<button class="fmt ${home.formats.includes(k) ? "on" : ""}" data-fmt="${k}">${fmtIcon(k)}<span><b>${k === "portrait" ? "Dọc 9:16" : "Ngang 16:9"}</b><small>${fmtSub[k] || esc(v.label)}</small></span><span class="check">✓</span></button>`).join("")}</div>
        <details class="adv" ${home.advOpen ? "open" : ""}>
          <summary>Tuỳ chỉnh: mẫu, giọng đọc, số cảnh, nhạc nền</summary>
          <div class="adv-grid">
            <div class="field" style="grid-column:1/-1"><label>Mẫu video</label><div class="tpl-opts">${Object.entries(config.templates).map(([k, v]) => `<button class="tpl ${home.template === k ? "on" : ""}" data-tpl="${k}">${frameScene({ heading: k === "cards" ? "3" : "Mưa", emoji: k === "cards" ? "🐥" : "🌧️", count: k === "cards" ? 3 : 1, caption: k === "cards" ? "Ba chú gà" : "Nước rơi", color: k === "cards" ? "#FECA57" : "#2F8BE6" }, { template: k })}<span>${esc(v.split(":")[0])}</span></button>`).join("")}</div></div>
            <div class="field"><label>Giọng đọc</label><div style="display:flex;gap:8px"><select id="voice" style="flex:1">${Object.entries(config.voices).map(([k, v]) => `<option value="${k}" ${k === home.voice ? "selected" : ""}>${esc(v)}</option>`).join("")}</select><button class="play" id="voiceTry" title="Nghe thử">▶</button></div></div>
            <div class="field"><label>Số cảnh</label><input type="number" id="sceneCount" min="3" max="12" placeholder="AI tự chọn (4-8)" value="${esc(home.sceneCount)}"></div>
            <div class="field"><label>Nhạc nền</label><select id="music"><option value="1" ${home.music ? "selected" : ""}>Có</option><option value="0" ${home.music ? "" : "selected"}>Không</option></select></div>
            <div class="field"><label>Công cụ dựng</label><select id="engine"><option value="remotion" ${home.engines.join() === "remotion" ? "selected" : ""}>Remotion (khuyên dùng)</option><option value="hyperframes" ${home.engines.join() === "hyperframes" ? "selected" : ""}>HyperFrames (sửa tay được HTML)</option><option value="both" ${home.engines.length === 2 ? "selected" : ""}>Cả hai (để so sánh)</option></select></div>
          </div>
        </details>
        <div class="composer-foot">
          <button class="btn primary lg" id="create">${config.llmConfigured ? "✨ Viết kịch bản" : "Tạo dự án"}</button>
          <span class="note">${config.llmConfigured ? "Mất khoảng 30-60 giây. Chưa tốn công render cho tới khi bạn duyệt." : `Chưa cài AI: bạn sẽ copy prompt sang Claude rồi dán kịch bản lại. <a href="#" id="setupAi">Cài AI để tự động</a>`}</span>
        </div>
      </section>
      <aside class="card channel-card">
        <div class="head"><img src="${logoUrl(b)}" alt="" onerror="this.style.visibility='hidden'"><div style="flex:1"><div class="muted" style="font-size:12px">Kênh</div><h3>${esc(b.name)}</h3></div></div>
        ${config.brands.length > 1 ? `<div class="field"><select id="brand">${brandOpts}</select></div>` : ""}
        <div class="kv"><b>Khán giả</b>${esc(b.audience)}</div>
        <div class="kv"><b>Giọng văn</b>${esc(b.style)}</div>
        <div class="divider"></div>
        <ul class="how">
          <li><i>1</i>AI viết kịch bản theo giọng kênh</li>
          <li class="me"><i>✋</i><span><b>Bạn duyệt kịch bản</b>: xem từng cảnh, nghe giọng, sửa</span></li>
          <li><i>2</i>AI lồng tiếng và dựng video</li>
          <li class="me"><i>✋</i><span><b>Bạn duyệt video</b></span></li>
          <li><i>3</i>Nhận sẵn tiêu đề, mô tả, hashtag để đăng</li>
        </ul>
      </aside>
    </div>

    <div class="section-head"><h2>Video của bạn</h2><span class="spacer" style="flex:1"></span>
      <div class="tabs">${[["all", "Tất cả"], ["need", "Cần bạn duyệt"], ["busy", "Đang làm"], ["done", "Sẵn sàng đăng"]].map(([k, l]) => `<button class="tab ${libFilter === k ? "on" : ""}" data-filter="${k}">${l}<span class="n">${counts[k]}</span></button>`).join("")}</div></div>
    ${shown.length ? `<div class="grid">${shown.map(videoCard).join("")}</div>` : `<div class="card empty"><div class="big">🎈</div><p>${projects.length ? "Không có video nào ở mục này." : "Chưa có video nào. Gõ ý tưởng đầu tiên ở trên nhé!"}</p></div>`}
  </div>`;
  wireHome();
}

function cardStatus(p) {
  if (p.job?.error) return { label: "Bị lỗi", cls: "err", next: "Xem lỗi & thử lại →" };
  if (p.status === "draft" && !isBusy(p)) return { label: "Chờ kịch bản", cls: "need", next: "Dán kịch bản →" };
  return STATUS[p.status] || STATUS.draft;
}
function videoCard(p) {
  const st = cardStatus(p);
  const b = brandOf(p.brand);
  const dur = p.duration ? fmtDur(p.duration) : p.spec ? `~${fmtDur(estTotal(p.spec))}` : "";
  return `<article class="card vcard" data-open="${p.id}">
    <div class="thumb">${thumbFor(p)}<span class="badge ${st.cls}">${isBusy(p) ? '<span class="spin"></span>' : ""}${st.label}</span>

    <div class="body"><div class="title">${esc(p.spec?.title || p.idea)}</div>
      <div class="meta"><span>${esc(b.name)}</span>·<span>${ago(p.createdAt)}</span>${dur ? `·<span>${dur}</span>` : ""}·<span>${p.formats.map((f) => (f === "portrait" ? "9:16" : "16:9")).join(" + ")}</span></div>
      <div class="next">${st.next}</div></div></article>`;

const estTotal = (spec) => 3 + estSec(spec.intro_narration, 3) + spec.scenes.reduce((a, s) => a + estSec(s.narration), 0) + estSec(spec.outro_narration, 4);

function wireHome() {
  const idea = $("#idea");
  idea.oninput = () => (home.idea = idea.value);
  idea.onkeydown = (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("#create").click(); };
  $$("[data-idea]").forEach((c) => (c.onclick = () => { home.idea = idea.value = c.dataset.idea; idea.focus(); }));
  $$("[data-fmt]").forEach((c) => (c.onclick = () => {
    const k = c.dataset.fmt;
    const next = home.formats.includes(k) ? home.formats.filter((x) => x !== k) : [...home.formats, k];
    if (!next.length) return toast("Chọn ít nhất 1 khung hình");
    home.formats = next; c.classList.toggle("on");
  }));
  $$("[data-tpl]").forEach((c) => (c.onclick = () => { home.template = c.dataset.tpl; $$("[data-tpl]").forEach((x) => x.classList.toggle("on", x === c)); }));
  $("details.adv").ontoggle = (e) => (home.advOpen = e.target.open);
  $("#voice").onchange = (e) => (home.voice = e.target.value);
  $("#voiceTry").onclick = guard((e) => speak(e.currentTarget, "Xin chào các bé! Hôm nay chúng mình cùng học thật vui nhé!", home.voice));
  $("#sceneCount").oninput = (e) => (home.sceneCount = e.target.value);
  $("#music").onchange = (e) => (home.music = e.target.value === "1");
  $("#engine").onchange = (e) => (home.engines = e.target.value === "both" ? ["remotion", "hyperframes"] : [e.target.value]);
  const br = $("#brand");
  if (br) br.onchange = () => { home.brand = br.value; home.voice = brandOf(br.value).voice || home.voice; renderHome(); };
  const setup = $("#setupAi");
  if (setup) setup.onclick = (e) => { e.preventDefault(); openSettings(); };
  $("#create").onclick = guard(async () => {
    if (!home.idea.trim()) { idea.focus(); return toast("Gõ ý tưởng video trước nhé"); }
    $("#create").disabled = true;
    try {
      const p = await api("/api/projects", { idea: home.idea.trim(), brand: home.brand, template: home.template, sceneCount: home.sceneCount || undefined, formats: home.formats, engines: home.engines, voice: home.voice, music: home.music });
      home.idea = "";
      location.hash = `#/p/${p.id}`;
    } finally { const b = $("#create"); if (b) b.disabled = false; }
  });
  $$("[data-filter]").forEach((t) => (t.onclick = () => { libFilter = t.dataset.filter; renderHome(); }));
  $$("[data-open]").forEach((c) => (c.onclick = (e) => { if (!e.target.closest("[data-del]")) location.hash = `#/p/${c.dataset.open}`; }));
  $$("[data-del]").forEach((d) => (d.onclick = guard(async () => {
    const p = projects.find((x) => x.id === d.dataset.del);
    if (!confirm(`Xoá dự án "${p?.spec?.title || p?.idea}"? Video và giọng đọc của dự án cũng bị xoá.`)) return;
    await api(`/api/projects/${d.dataset.del}`, undefined, "DELETE");
    toast("Đã xoá dự án");
    renderHome();
  })));
  if (!projects.length) idea.focus();
}

// ============================================================ workspace
async function openProject(id) {
  current = await api(`/api/projects/${id}`);
  draft = current.spec ? structuredClone(current.spec) : null;
  dirty = false;
  renderWorkspace();
}

function poll() {
  clearTimeout(pollTimer);
  if (!current) return;
  const id = current.id;
  pollTimer = setTimeout(async () => {
    if (!current || current.id !== id) return;
    try {
      const fresh = await api(`/api/projects/${id}`);
      if (!current || current.id !== id) return;
      const changed = fresh.updatedAt !== current.updatedAt;
      const prev = current;
      current = fresh;
      // Never overwrite edits the person hasn't saved.
      if (changed && !dirty && !selected) {
        if (fresh.spec && JSON.stringify(fresh.spec) !== JSON.stringify(prev.spec)) draft = structuredClone(fresh.spec);
        renderWorkspace();
        return;
      }
      if (changed && isBusy(fresh)) updateProgress();
    } catch {}
    poll();
  }, isBusy(current) ? 1500 : 6000);
}

const STEPS = [["script", "Kịch bản"], ["produce", "Sản xuất"], ["review", "Duyệt video"], ["publish", "Đăng bài"]];
function stepIndex(p) {
  if (p.status === "approved") return 3;
  if (p.status === "video_review") return 2;
  if (p.status === "producing") return 1;
  return 0;
}
function stepper(p) {
  const idx = stepIndex(p);
  return `<nav class="stepper">${STEPS.map(([, l], i) => `${i ? `<span class="st-line ${i <= idx ? "done" : ""}"></span>` : ""}<span class="st ${i < idx || (i === 3 && idx === 3) ? "done" : i === idx ? "now" : ""}"><span class="n">${i < idx || (i === 3 && idx === 3) ? "✓" : i + 1}</span>${l}</span>`).join("")}</nav>`;
}

function errorBanner(p) {
  if (!p.job?.error) return "";
  const retry = { script: "Viết lại kịch bản", produce: "Sản xuất lại" }[p.job.step];
  const where = { script: "AI viết kịch bản", revise: "AI sửa kịch bản", produce: "sản xuất video" }[p.job.step] || p.job.step;
  return `<div class="banner err"><span style="font-size:20px">⚠️</span><div class="msg"><b>Lỗi ở bước ${esc(where)}</b>${esc(p.job.error)}</div>${retry ? `<button class="btn sm" id="retry">↻ ${retry}</button>` : ""}</div>`;
}

function renderWorkspace() {
  const p = current;
  const b = brandOf(p.brand);
  let body = "";
  if (p.status === "producing" || (p.job?.step === "produce" && isBusy(p))) body = viewProducing(p);
  else if (p.status === "video_review") body = viewReview(p);
  else if (p.status === "approved") body = viewPublish(p);
  else if (!p.spec) body = isBusy(p) ? viewWriting(p) : viewManual(p);
  else body = viewStoryboard(p);

  $("#app").innerHTML = `<div class="page">
    <div class="ws-head">
      <a class="btn ghost sm back" href="#/">← Tất cả video</a>
    </div>
    <div class="ws-head" style="margin-top:6px">
      <div class="ws-title"><h1>${esc(draft?.title || p.idea)}</h1>
        <div class="meta"><img src="${logoUrl(b)}" alt="" onerror="this.style.display='none'">${esc(b.name)} · <span class="muted">Ý tưởng: ${esc(p.idea)}</span></div></div>
    </div>
    ${stepper(p)}
    ${errorBanner(p)}
    ${body}
    <details class="log"><summary>Nhật ký dự án (${(p.log || []).length})</summary><div class="lines">${(p.log || []).slice().reverse().map((l) => `<div>${new Date(l.at).toLocaleString("vi-VN")} · ${esc(l.msg)}</div>`).join("")}</div></details>
  </div>${actionBar(p)}`;
  wireWorkspace(p);
  poll();
}

// ---------- storyboard (script review) ----------
function shotList(spec) {
  return [
    { key: "intro", tag: "Mở đầu", narration: spec.intro_narration, min: 3 },
    ...spec.scenes.map((s, i) => ({ key: String(i), tag: `Cảnh ${i + 1}`, narration: s.narration, scene: s, min: 3.5 })),
    { key: "outro", tag: "Kết", narration: spec.outro_narration, min: 4 },
  ];
}
function shotFrame(key, spec, brand) {
  if (key === "intro") return frameIntro(spec, brand);
  if (key === "outro") return frameOutro(spec, brand);
  return frameScene(spec.scenes[Number(key)], { template: spec.template });
}
function viewStoryboard(p) {
  const spec = draft;
  const b = brandOf(p.brand);
  const busy = isBusy(p);
  const total = estTotal(spec);
  return `${busy ? `<div class="banner info"><span class="spin"></span><div class="msg"><b>AI đang sửa kịch bản…</b>Kịch bản mới sẽ hiện ở đây khi xong.</div></div>` : ""}
    <div class="board-head"><h2>Storyboard</h2>
      <div class="stats"><span class="badge">${spec.scenes.length} cảnh</span><span class="badge">~${fmtDur(total)}</span><span class="badge">${esc((config.templates[spec.template] || spec.template).split(":")[0])}</span><span class="badge">🎙 ${esc(config.voices[p.voice] || p.voice)}</span></div>
      <span style="flex:1"></span><button class="btn sm" id="playAll" ${config.tts ? "" : "disabled"}>▶ Nghe cả kịch bản</button></div>
    <div class="card revise"><span class="ai">🤖</span><input id="feedback" placeholder="Nhờ AI sửa, VD: thêm 2 cảnh về con mèo, lời đọc vui hơn" ${busy ? "disabled" : ""}><button class="btn primary sm" id="revise" ${busy ? "disabled" : ""}>Sửa</button></div>
    <div class="chips revise-chips">${["Lời đọc vui hơn", "Ngắn gọn hơn", "Thêm 2 cảnh", "Màu sắc tươi hơn", "Tiêu đề YouTube hấp dẫn hơn"].map((c) => `<button class="chip" data-fb="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="shots">${shotList(spec).map((s) => `${s.key === "outro" && spec.scenes.length < 12 ? `<button class="add-shot" id="addShot">＋ Thêm cảnh</button>` : ""}<article class="card shot ${selected === s.key ? "sel" : ""}" data-shot="${s.key}">
        ${shotFrame(s.key, spec, b)}
        <div class="row"><span class="tag">${s.tag}</span><span class="dur">~${fmtDur(estSec(s.narration, s.min))}</span><span style="flex:1"></span><button class="btn ghost sm" data-edit="${s.key}">✎ Sửa</button></div>
        <div class="narr"><button class="play" data-say="${s.key}" title="Nghe thử">▶</button><p>${esc(s.narration)}</p></div></article>`).join("")}</div>`;
}

// ---------- producing ----------
function phasesOf(p) {
  const label = p.job?.label || "";
  const voiceDone = (p.job?.progress ?? 0) >= 0.15 || label.startsWith("render") || (p.renders || []).length > 0;
  const list = [{ key: "voice", name: "Lồng tiếng", done: voiceDone, now: !voiceDone }];
  for (const engine of p.engines) for (const format of p.formats) {
    const done = (p.renders || []).some((r) => r.engine === engine && r.format === format);
    list.push({ key: `render:${engine}:${format}`, name: `Dựng video ${format === "portrait" ? "dọc 9:16" : "ngang 16:9"}${p.engines.length > 1 ? ` (${ENGINE[engine]})` : ""}`, done, now: !done && label === `render:${engine}:${format}` });
  }
  return list;
}
function viewProducing(p) {
  const pct = Math.round((p.job?.progress ?? 0) * 100);
  return `<div class="prod">
    <section class="card prod-main">
      <div class="muted" style="font-weight:600">Đang sản xuất</div>
      <div class="big-pct" id="pct">${pct}%</div>
      <div class="bar"><div id="barFill" style="width:${Math.max(2, pct)}%"></div></div>
      <ul class="phases" id="phases">${phasesHtml(p)}</ul>
      <p class="muted" style="margin:22px 0 0">Mỗi bản video 30 giây mất khoảng 1-2 phút. Bạn có thể quay lại danh sách, video sẽ chờ bạn duyệt.</p>
    </section>
    <aside class="card"><div class="mini-shots">${draft ? shotList(draft).map((s) => shotFrame(s.key, draft, brandOf(p.brand))).join("") : ""}</div></aside></div>`;
}
const phasesHtml = (p) => phasesOf(p).map((ph) => `<li class="${ph.done ? "done" : ph.now ? "now" : ""}"><span class="ic">${ph.done ? "✓" : ph.now ? '<span class="spin"></span>' : ""}</span>${esc(ph.name)}</li>`).join("");
function updateProgress() {
  const pct = Math.round((current.job?.progress ?? 0) * 100);
  const a = $("#pct"), f = $("#barFill"), ph = $("#phases");
  if (a) a.textContent = `${pct}%`;
  if (f) f.style.width = `${Math.max(2, pct)}%`;
  if (ph) ph.innerHTML = phasesHtml(current);
}

  }
  return "";
}

// ---------- drawer: edit one shot ----------
function openDrawer(key) {
  selected = key;
  $$(".shot").forEach((s) => s.classList.toggle("sel", s.dataset.shot === key));
  renderDrawer();
  $("#drawer").classList.add("open");
  $("#drawer").setAttribute("aria-hidden", "false");
}
function closeDrawer(silent) {
  selected = null;
  const d = $("#drawer");
  d.classList.remove("open");
  d.setAttribute("aria-hidden", "true");
  if (!silent) { $$(".shot").forEach((s) => s.classList.remove("sel")); poll(); }
}
function renderDrawer() {
  const key = selected;
  const spec = draft;
  const b = brandOf(current.brand);
  const i = Number(key);
  const sc = spec.scenes[i];
  let fields = "";
  if (key === "intro") {
    fields = `<div class="field"><label>Tên video (hiện trên màn hình)</label><input type="text" data-f="title" value="${esc(spec.title)}"></div>

      <div class="field"><label>Mẫu video</label><select data-f="template">${Object.entries(config.templates).map(([k, v]) => `<option value="${k}" ${spec.template === k ? "selected" : ""}>${esc(v.split(":")[0])}</option>`).join("")}</select></div>`;
  } else if (key === "outro") {
    fields = `<div class="field"><label>🎙 Lời kết</label><textarea rows="3" data-f="outro_narration">${esc(spec.outro_narration)}</textarea><div class="hint">Chữ trên màn hình cuối lấy từ cài đặt kênh: "${esc(b.outroText)}".</div></div>`;
  } else {
    fields = `<div class="two"><div class="field"><label>Chữ lớn</label><input type="text" data-s="heading" value="${esc(sc.heading)}" maxlength="14"></div>
        <div class="field"><label>Số lượng</label><div class="stepper-num"><button data-cnt="-1">−</button><span id="cnt">${sc.count}</span><button data-cnt="1">+</button></div></div></div>
      <div class="field"><label>Emoji</label><input type="text" data-s="emoji" value="${esc(sc.emoji)}"></div>
      <div class="field"><label>Chú thích</label><input type="text" data-s="caption" value="${esc(sc.caption)}" maxlength="48"></div>
      <div class="field"><label>🎙 Lời đọc</label><textarea rows="3" data-s="narration">${esc(sc.narration)}</textarea><div class="hint" id="narrHint">~${fmtDur(estSec(sc.narration))} · viết số bằng chữ ("ba quả táo")</div></div>
      <div class="field"><label>Màu nền</label><div class="swatches">${PALETTE.map((c) => `<button class="sw ${c.toLowerCase() === sc.color.toLowerCase() ? "on" : ""}" style="background:${c}" data-color="${c}" aria-label="${c}"></button>`).join("")}<input type="color" data-s="color" value="${esc(sc.color)}" title="Màu khác"></div></div>`;
  }
  const title = key === "intro" ? "Mở đầu" : key === "outro" ? "Kết" : `Cảnh ${i + 1}`;
  $("#drawer").innerHTML = `<header><h3>${title}</h3>
      ${!isNaN(i) ? `<button class="icon-btn" data-move="-1" title="Lên trước" ${i === 0 ? "disabled" : ""}>↑</button><button class="icon-btn" data-move="1" title="Xuống sau" ${i === spec.scenes.length - 1 ? "disabled" : ""}>↓</button>` : ""}
      <button class="icon-btn" id="drawerClose" aria-label="Đóng">✕</button></header>
    <div class="content"><div id="drawerFrame">${shotFrame(key, spec, b)}</div>
      <div style="display:flex;gap:8px;align-items:center"><button class="play" id="drawerSay">▶</button><span class="muted" style="font-size:13px">Nghe thử lời đọc</span></div>
      ${fields}</div>
    <footer>${!isNaN(i) ? `<button class="btn ghost danger" id="delShot" ${spec.scenes.length <= 1 ? "disabled" : ""}>Xoá cảnh</button>` : ""}<span style="flex:1"></span><button class="btn primary" id="drawerDone">Xong</button></footer>`;
  wireDrawer();
}
function refreshShot(key) {
  const b = brandOf(current.brand);
  const card = $(`.shot[data-shot="${key}"]`);
  if (card) {
    card.querySelector(".frame").outerHTML = shotFrame(key, draft, b);
    const s = shotList(draft).find((x) => x.key === key);
    card.querySelector(".narr p").textContent = s.narration;
    card.querySelector(".dur").textContent = `~${fmtDur(estSec(s.narration, s.min))}`;
  }
  $("#drawerFrame").innerHTML = shotFrame(key, draft, b);
  if (key === "intro") { const h = $(".ws-title h1"); if (h) h.textContent = draft.title; }
}
function markDirty() {
  if (dirty) return;
  dirty = true;
  const bar = $(".actionbar");
  if (bar) bar.outerHTML = actionBar(current);
  wireActionBar(current);
}
function wireDrawer() {
  const key = selected;
  const i = Number(key);
  $("#drawerClose").onclick = () => closeDrawer();
  $("#drawerDone").onclick = () => closeDrawer();
  $("#drawerSay").onclick = guard((e) => speak(e.currentTarget, shotList(draft).find((s) => s.key === key).narration, current.voice));
  $$("#drawer [data-f]").forEach((el) => (el.oninput = el.onchange = () => {
    draft[el.dataset.f] = el.value; markDirty();
    if (el.dataset.f === "template") { renderWorkspace(); openDrawer(key); } else refreshShot(key);
  }));
  $$("#drawer [data-s]").forEach((el) => (el.oninput = () => {
    draft.scenes[i][el.dataset.s] = el.value; markDirty(); refreshShot(key);
    if (el.dataset.s === "narration") $("#narrHint").textContent = `~${fmtDur(estSec(el.value))} · viết số bằng chữ ("ba quả táo")`;
    if (el.dataset.s === "color") $$("#drawer .sw").forEach((s) => s.classList.remove("on"));
  }));
  $$("#drawer [data-color]").forEach((el) => (el.onclick = () => {
    draft.scenes[i].color = el.dataset.color; markDirty(); refreshShot(key);
    $$("#drawer .sw").forEach((s) => s.classList.toggle("on", s === el));
    $('#drawer [data-s="color"]').value = el.dataset.color;
  }));
  $$("#drawer [data-cnt]").forEach((el) => (el.onclick = () => {
    const sc = draft.scenes[i];
    sc.count = Math.min(10, Math.max(1, sc.count + Number(el.dataset.cnt)));
    $("#cnt").textContent = sc.count; markDirty(); refreshShot(key);
  }));
  $$("#drawer [data-move]").forEach((el) => (el.onclick = () => {
    const j = i + Number(el.dataset.move);
    [draft.scenes[i], draft.scenes[j]] = [draft.scenes[j], draft.scenes[i]];
    markDirty(); renderWorkspace(); openDrawer(String(j));
  }));
  const del = $("#delShot");
  if (del) del.onclick = () => {
    if (!confirm(`Xoá cảnh ${i + 1}?`)) return;
    draft.scenes.splice(i, 1); markDirty(); closeDrawer(true); renderWorkspace();
  };
}

// ---------- wiring ----------
async function saveSpec(note) {
  current = await api(`/api/projects/${current.id}/spec`, { spec: draft, note });
  draft = structuredClone(current.spec);
  dirty = false;
}
function wireActionBar(p) {
  const save = $("#saveSpec");
  if (save) save.onclick = guard(async () => { await saveSpec("Người duyệt đã sửa kịch bản"); toast("Đã lưu kịch bản"); renderWorkspace(); });
  $$("[data-outfmt]").forEach((b) => (b.onclick = guard(async () => {
    const k = b.dataset.outfmt;
    const next = p.formats.includes(k) ? p.formats.filter((x) => x !== k) : [...p.formats, k];
    if (!next.length) return toast("Chọn ít nhất 1 khung hình");
    const fresh = await api(`/api/projects/${p.id}/settings`, { formats: next });
    current.formats = fresh.formats; current.updatedAt = fresh.updatedAt;
    b.classList.toggle("on");
  })));
  const approve = $("#approveScript");
  if (approve) approve.onclick = guard(async () => {
    approve.disabled = true;
    await saveSpec("Kịch bản đã được duyệt");
    await api(`/api/projects/${p.id}/approve-script`, {});
    openProject(p.id);
  });
  const sp = $("#savePublish");
  if (sp) sp.onclick = guard(async () => { await saveSpec("Đã sửa nội dung đăng bài"); toast("Đã lưu nội dung đăng bài"); renderWorkspace(); });
}
function wireWorkspace(p) {
  const on = (sel, fn) => { const el = $(sel); if (el) el.onclick = guard(fn); };
  wireActionBar(p);
  on("#retry", async () => {
    if (p.job.step === "script") await api(`/api/projects/${p.id}/script`, {});
    else if (p.job.step === "produce") await api(`/api/projects/${p.id}/approve-script`, {});
    openProject(p.id);
  });
  const sa = $("#setupAi2");
  if (sa) sa.onclick = (e) => { e.preventDefault(); openSettings(); };
  on("#copyPrompt", async () => {
    const fb = $("#copyPrompt").dataset.feedback;
    const { prompt } = await api(`/api/projects/${p.id}/prompt${fb ? `?feedback=${encodeURIComponent(fb)}` : ""}`);
    await navigator.clipboard.writeText(prompt);
    toast("Đã copy prompt. Dán vào Claude nhé.");
  });
  on("#importSpec", async () => {
    current = await api(`/api/projects/${p.id}/spec`, { text: $("#pasted").value, note: "Đã nhập kịch bản dán từ Claude" });
    draft = structuredClone(current.spec); dirty = false; toast("Đã nhập kịch bản"); renderWorkspace();
  });
  // storyboard
  $$("[data-shot] .frame, [data-edit]").forEach((el) => (el.onclick = () => openDrawer(el.closest("[data-shot]").dataset.shot)));
  $$("[data-say]").forEach((el) => (el.onclick = guard(() => speak(el, shotList(draft).find((s) => s.key === el.dataset.say).narration, p.voice))));
  on("#playAll", async () => {
    const btn = $("#playAll");
    btn.disabled = true;
    try {
      for (const s of shotList(draft)) {
        const play = $(`[data-say="${s.key}"]`);
        play.closest(".shot").scrollIntoView({ behavior: "smooth", block: "center" });
        await speak(play, s.narration, p.voice);
        await new Promise((r) => (audio.onended = () => { play.textContent = "▶"; r(); }));
      }
    } finally { btn.disabled = false; }
  });
  on("#addShot", async () => {
    const last = draft.scenes[draft.scenes.length - 1];
    draft.scenes.push({ heading: "Mới", emoji: "⭐", count: 1, caption: "Chú thích", narration: "Lời đọc cho cảnh mới.", color: PALETTE[draft.scenes.length % PALETTE.length] === last?.color ? PALETTE[0] : PALETTE[draft.scenes.length % PALETTE.length] });
    markDirty(); renderWorkspace(); openDrawer(String(draft.scenes.length - 1));
  });
  $$("[data-fb]").forEach((c) => (c.onclick = () => { const f = $("#feedback"); f.value = f.value ? `${f.value}, ${c.dataset.fb.toLowerCase()}` : c.dataset.fb; f.focus(); }));
  const fb = $("#feedback");
  if (fb) fb.onkeydown = (e) => { if (e.key === "Enter") $("#revise").click(); };
  on("#revise", async () => {
    const feedback = $("#feedback").value.trim();
    if (!feedback) { $("#feedback").focus(); return toast("Gõ yêu cầu sửa trước nhé"); }
    if (dirty) await saveSpec("Lưu trước khi AI sửa");
    if (!config.llmConfigured) {
      const { prompt } = await api(`/api/projects/${p.id}/prompt?feedback=${encodeURIComponent(feedback)}`);
      await navigator.clipboard.writeText(prompt);
      $("#app .page").insertAdjacentHTML("beforeend", viewManual(p));
      wireWorkspace(p);
      $("#pasted").scrollIntoView({ behavior: "smooth" });
      return toast("Chưa cài AI: đã copy prompt sửa kịch bản, dán vào Claude rồi dán kết quả vào ô bên dưới");
    }
    await api(`/api/projects/${p.id}/revise`, { feedback });
    openProject(p.id);
  });
  // review
  $$("[data-rfb]").forEach((c) => (c.onclick = () => { const f = $("#rejectFeedback"); f.value = f.value ? `${f.value}, ${c.dataset.rfb.toLowerCase()}` : c.dataset.rfb; }));
  on("#approveVideo", async () => { current = await api(`/api/projects/${p.id}/approve-video`, {}); draft = structuredClone(current.spec); renderWorkspace(); toast("🎉 Đã duyệt video"); });
  on("#rejectVideo", async () => {
    const feedback = $("#rejectFeedback").value.trim();
    if (!feedback) { $("#rejectFeedback").focus(); return toast("Ghi yêu cầu sửa trước nhé"); }
    await api(`/api/projects/${p.id}/reject-video`, { feedback });
    openProject(p.id);
  });
  // publish
  $$("[data-copy]").forEach((b) => (b.onclick = guard(async () => { await navigator.clipboard.writeText($(`#${b.dataset.copy}`).value); b.textContent = "✓ Đã copy"; setTimeout(() => (b.textContent = "Copy"), 1500); })));
  $$("[data-pub]").forEach((t) => (t.oninput = () => {
    const pub = draft.publish;
    const v = t.value;
    if (t.id === "yt-title") pub.youtube.title = v;
    if (t.id === "yt-desc") pub.youtube.description = v;
    if (t.id === "yt-tags") pub.youtube.tags = v.split(",").map((x) => x.trim()).filter(Boolean);
    if (t.id === "fb-post") pub.facebook.post = v;
    if (t.id === "tt-cap") { const tags = v.match(/#[^\s#]+/g) || []; pub.tiktok.hashtags = tags; pub.tiktok.caption = v.replace(/#[^\s#]+/g, "").replace(/\s+/g, " ").trim(); }
    const c = $(`[data-count="${t.id}"]`);
    if (c) { const n = [...v].length; c.textContent = `${n}/${c.dataset.max}`; c.classList.toggle("over", n > Number(c.dataset.max)); }
    markDirty();
  }));
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && selected) closeDrawer(); });
window.addEventListener("beforeunload", (e) => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

// ============================================================ settings dialog
let settings = null;
function showProviderFields() {
  const id = $("#s-provider").value;
  const prov = settings.providers[id];
  const same = id === settings.llm.provider;
  $("#s-models").innerHTML = prov.models.map((m) => `<option value="${esc(m)}">`).join("");
  $("#s-model").placeholder = prov.defaultModel || "tên model, VD: llama3.1";
  $("#s-baseUrl-row").classList.toggle("hidden", id !== "openai-compatible");
  $("#s-effort-row").classList.toggle("hidden", id !== "anthropic");
  const keyed = same && settings.llm.hasKey;
  $("#s-apiKey").placeholder = keyed ? settings.llm.apiKey : prov.needsKey ? "Dán API key vào đây" : "Không bắt buộc";
  $("#s-keyHint").textContent = keyed
    ? settings.llm.keySource === "env" ? "Đang dùng key trong file .env. Nhập key mới để thay." : "Đã lưu key. Để trống để giữ nguyên."
    : prov.needsKey ? "Key được lưu trên máy này (data/settings.json), không hiện lại đầy đủ." : "";
  $("#s-clearKey").classList.toggle("hidden", !(same && settings.llm.keySource === "settings"));
}
function settingsForm() {
  const provider = $("#s-provider").value;
  const llm = { provider, model: $("#s-model").value, apiKey: $("#s-apiKey").value, effort: $("#s-effort").value };
  if (provider === "openai-compatible") llm.baseUrl = $("#s-baseUrl").value;
  return llm;
}
function fillSettings() {
  const { llm, providers, efforts } = settings;
  $("#s-provider").innerHTML = Object.entries(providers).map(([k, v]) => `<option value="${k}" ${k === llm.provider ? "selected" : ""}>${esc(v.label)}</option>`).join("");
  $("#s-effort").innerHTML = efforts.map((e) => `<option value="${e}" ${e === llm.effort ? "selected" : ""}>${{ low: "Thấp", medium: "Vừa", high: "Cao" }[e]}</option>`).join("");
  $("#s-model").value = llm.model;
  $("#s-baseUrl").value = llm.provider === "openai-compatible" ? llm.baseUrl : providers["openai-compatible"].baseUrl;
  $("#s-apiKey").value = "";
  showProviderFields();
}
async function openSettings() {
  settings = await api("/api/settings");
  fillSettings();
  $("#s-result").innerHTML = "";
  $("#s-provider").onchange = () => {
    const prov = settings.providers[$("#s-provider").value];
    $("#s-model").value = $("#s-provider").value === settings.llm.provider ? settings.llm.model : prov.defaultModel;
    showProviderFields();
  };
  const busy = async (btn, fn) => {
    btn.disabled = true;
    try { await fn(); } catch (e) { $("#s-result").innerHTML = `<div class="msg-err">${esc(e.message)}</div>`; } finally { btn.disabled = false; }
  };
  $("#s-save").onclick = () => busy($("#s-save"), async () => {
    settings = await api("/api/settings", { llm: settingsForm() });
    fillSettings();
    await loadConfig();
    $("#s-result").innerHTML = `<div class="msg-ok">Đã lưu. ${settings.llm.ready ? "AI sẵn sàng." : "Chưa đủ thông tin để gọi AI (thiếu key hoặc model)."}</div>`;
    if (!current) renderHome();
  });
  $("#s-test").onclick = () => busy($("#s-test"), async () => {
    $("#s-result").innerHTML = `<div class="muted">Đang kiểm tra…</div>`;
    const r = await api("/api/settings/test", { llm: settingsForm() });
    $("#s-result").innerHTML = r.ok ? `<div class="msg-ok">✅ Kết nối được: ${esc(r.model)}</div>` : `<div class="msg-err">❌ ${esc(r.error)}</div>`;
  });
  $("#s-clearKey").onclick = () => busy($("#s-clearKey"), async () => {
    if (!confirm("Xoá API key đã lưu?")) return;
    settings = await api("/api/settings", { llm: { clearKey: true } });
    fillSettings();
    await loadConfig();
    $("#s-result").innerHTML = `<div class="msg-ok">Đã xoá key.</div>`;
  });
  $("#s-close").onclick = () => $("#settings").close();
  $("#settings").showModal();
}
$("#openSettings").onclick = guard(openSettings);
$("#aiPill").onclick = guard(openSettings);

// ============================================================ boot
(async () => {
  try { await loadConfig(); await route(); }
  catch (e) { $("#app").innerHTML = `<div class="page"><div class="banner err"><div class="msg"><b>Không tải được ứng dụng</b>${esc(e.message)}</div></div></div>`; }
})();
</script>
</body>
