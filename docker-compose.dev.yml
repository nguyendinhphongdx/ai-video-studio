# Development services: docker compose -f docker-compose.dev.yml up -d   (npm run db:dev)
# Postgres: the app's default DATABASE_URL (src/server/db.ts) points here: postgres://avs:avs@127.0.0.1:5433/avs
# S3Mock (S3-compatible, optional): to try object storage locally, put in .env
#   S3_BUCKET=avs-media  S3_ENDPOINT=http://127.0.0.1:9090  S3_ACCESS_KEY_ID=dev  S3_SECRET_ACCESS_KEY=dev
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: avs
      POSTGRES_PASSWORD: avs
      POSTGRES_DB: avs
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data

  # S3-compatible storage for trying object storage locally (no auth; the bucket exists at start).
  s3:
    image: adobe/s3mock:4.4.0
    restart: unless-stopped
    environment:
      initialBuckets: avs-media
      retainFilesOnExit: "true"
      root: /data
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3-dev:/data

volumes:
  pgdata-dev:
  s3-dev:
